[tox]
# https://github.com/tox-dev/tox/issues/3238
requires = tox >=4.39

envlist =
    lint
    numpy-tests
    cupy-tests
    pytorch-tests
    torch-tests
    jax-tests
    docs-tests
    cxx-tests
    fortran-tests
    torch-cxx-tests
    single-build-tests

[testenv]
lint-folders = python setup.py
package = external
package_env = build-vesin

build_single_wheel = --no-deps --force-reinstall --no-build-isolation --check-build-dependencies

# this warning fires when collecting tests and seemingly can not be
# supressed by the code in pyproject.toml, so we add it as a CLI flag
test_args =
    -W "ignore:`torch.jit.script` is not supported in Python 3.14+ and may break:"
packaging_deps =
    cmake
    setuptools >= 77

torch_deps =
    metatomic-torch >=0.1,<0.2
    torch=={env:VESIN_TESTS_TORCH_VERSION:2.13}.*

jax_deps =
    jax=={env:VESIN_TESTS_JAX_VERSION:0.11}.*
    jaxlib=={env:VESIN_TESTS_JAX_VERSION:0.11}.*

[testenv:check-cuda-available]
description = Tests that CUDA is available in PyTorch and CuPy
package = skip
passenv = *
deps =
    torch=={env:VESIN_TESTS_TORCH_VERSION:2.13}.*
allowlist_externals = bash
commands =
    bash ./scripts/install-cupy.sh
    python -c "import torch; assert(torch.cuda.is_available() and torch.version.cuda)"
    python -c "import cupy as cp; cp.cuda.Device(0).compute_capability"

[testenv:build-vesin]
passenv = *
deps =
    {[testenv]packaging_deps}

commands =
    pip wheel python/vesin --no-deps --no-build-isolation --check-build-dependencies --wheel-dir {envtmpdir}/dist

[testenv:numpy-tests]
passenv = *
description = Run the Python tests for vesin with numpy arrays
deps =
    pytest
    pytest-timeout
    ase

allowlist_externals = bash
changedir = python/vesin
commands =
    pytest {[testenv]test_args} {posargs}


[testenv:cupy-tests]
passenv = *
description = Run the Python tests for vesin with cupy arrays
deps =
    pytest
    pytest-timeout
    ase

allowlist_externals = bash
changedir = python/vesin
commands =
    bash ../../scripts/install-cupy.sh
    pytest {[testenv]test_args} {posargs}


[testenv:pytorch-tests]
passenv = *
description = Run the tests of vesin with PyTorch arrays
deps =
    pytest
    pytest-timeout
    ase
    {[testenv]torch_deps}

changedir = python/vesin
commands =
    pytest {[testenv]test_args} {posargs}


[testenv:torch-tests]
passenv = *
description = Run the tests of the vesin-torch Python package
deps =
    {[testenv]packaging_deps}
    pytest
    ase
    {[testenv]torch_deps}

changedir = python/vesin_torch
commands =
    pip install {[testenv]build_single_wheel} .

    # Make torch.autograd.gradcheck works with pytest
    python {toxinidir}/scripts/pytest-dont-rewrite-torch.py

    pytest {[testenv]test_args} {posargs}


[testenv:jax-tests]
passenv = *
description = Run the tests of the vesin-jax Python package
deps =
    {[testenv]packaging_deps}
    pytest
    ase
    {[testenv]jax_deps}

changedir = python/vesin_jax
commands =
    pip install {[testenv]build_single_wheel} .

    pytest {[testenv]test_args} {posargs}


[testenv:docs-tests]
passenv = *
package = skip
description = Check that the documentation examples work
deps =
    {[testenv]packaging_deps}
    pytest
    pytest-custom_exit_code
    ase
    {[testenv]torch_deps}
    {[testenv]jax_deps}

commands =
    pip install {[testenv]build_single_wheel} python/vesin
    pip install {[testenv]build_single_wheel} python/vesin_torch

    pytest {[testenv]test_args} --suppress-no-test-exit-code --doctest-modules --pyargs vesin
    pytest {[testenv]test_args} --suppress-no-test-exit-code --doctest-modules --pyargs vesin_torch


[testenv:cxx-tests]
passenv = *
description = Run the C++ tests
package = skip
deps = cmake

commands =
    cmake -B {envdir}/build -S vesin -DVESIN_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
    cmake --build {envdir}/build --config Debug
    ctest --test-dir {envdir}/build --build-config Debug --output-on-failure


[testenv:torch-cxx-tests]
passenv = *
description = Run the C++ tests of vesin-torch
package = skip
deps =
    {[testenv]packaging_deps}
    {[testenv]torch_deps}

allowlist_externals = bash
commands =
    # the Python package is used to generate the models used by the tests
    pip install {[testenv]build_single_wheel} python/vesin_torch

    # use $TOX_ENV_DIR instead of {envdir}, since bash would interpret the
    # backslashes in Windows paths
    bash -c "cmake -B $TOX_ENV_DIR/build -S vesin-torch \
        -DVESIN_TORCH_BUILD_TESTS=ON \
        -DCMAKE_BUILD_TYPE=Debug \
        -DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)') \
        -DCMAKE_PREFIX_PATH=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"

    cmake --build {envdir}/build --config Debug
    ctest --test-dir {envdir}/build --build-config Debug --output-on-failure --timeout 300


[testenv:single-build-tests]
passenv = *
description = Check that the single file can be created and compiled
package = skip
deps = cmake

commands =
    python ./vesin/scripts/create-single-cpp.py
    cmake -B {envdir}/build -S vesin/tests/single-cpp -DSINGLE_BUILD_DIR={toxinidir}/vesin/dist/
    cmake --build {envdir}/build --config Debug


[testenv:fortran-tests]
passenv = *
description = Run the Fortran tests
package = skip
deps = cmake

commands =
    cmake -B {envdir}/build -S fortran -DVESIN_FORTRAN_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
    cmake --build {envdir}/build --config Debug
    ctest --test-dir {envdir}/build --build-config Debug --output-on-failure


[testenv:lint]
description = Run linters and formatter
package = skip
deps =
    ruff

allowlist_externals = bash
commands =
    ruff format --diff {[testenv]lint-folders}
    ruff check {[testenv]lint-folders}
    python ./scripts/lint-integer-types.py


[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps =
    ruff

allowlist_externals = bash
commands =
    ruff format {[testenv]lint-folders}
    ruff check --fix-only {[testenv]lint-folders}


[testenv:docs]
passenv = *
description = Invoke sphinx-build to build the HTML docs
deps =
    sphinx
    breathe >=4.33     # C++ => sphinx through doxygen
    furo               # sphinx theme
    sphinx-design      # helpers for nicer docs website (tabs, grids, cards, …)

    ford == 7.0.*

    torch=={env:VESIN_TESTS_TORCH_VERSION:2.13}.*
    metatomic-torch >=0.1,<0.2
    cmake
    setuptools >= 77
    wheel >= 0.41

commands =
    pip install {[testenv]build_single_wheel} python/vesin_torch
    sphinx-build -d docs/build/doctrees -W -b html docs/src docs/build/html
    ford fortran/docs.md --output_dir=../docs/build/html/fortran/
