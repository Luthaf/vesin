name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            # TorchScript support is dropped in Python 3.14, so we keep a runner
            # for testing Python 3.13, making sure everything works fine there.
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.15"
          - os: macos-15
            # We get a failure that looks like https://github.com/pytorch/pytorch/issues/200779
            # when using python 3.15 with torch 2.14, so we downgrade python here
            # until we can upgrade torch everywhere
            python-version: "3.14"
          - os: windows-2022
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install tests dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: run tests
        run: tox -e lint,numpy-tests,cupy-tests,pytorch-tests
        env:
          # Use the CPU only version of torch when building/running the code
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
