name: JAX tests

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR

concurrency:
  group: jax-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  jax-tests:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / jax ${{ matrix.jax-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported version of jax
          - os: ubuntu-24.04
            python-version: "3.10"
            jax-version: "0.6.2"
          - os: ubuntu-24.04
            python-version: "3.14"
            jax-version: "0.12"
          - os: macos-15
            python-version: "3.14"
            jax-version: "0.12"
          - os: windows-2022
            python-version: "3.14"
            jax-version: "0.12"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install tests dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: run tests
        run: tox -e jax-tests
        env:
          VESIN_TESTS_JAX_VERSION: ${{ matrix.jax-version }}
